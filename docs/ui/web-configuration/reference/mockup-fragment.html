<style>
#rh-config{--rh-bg:#0b1321;--rh-panel:#111d30;--rh-raised:#17263c;--rh-line:#29374b;--rh-text:#f4f7fc;--rh-dim:#a7b5ca;--rh-blue:#3188f4;--rh-radius:14px;color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--rh-text);background:var(--rh-bg);border:1px solid var(--rh-line);border-radius:18px;overflow:hidden;font-size:14px;line-height:1.5;position:relative;isolation:isolate}
#rh-config *{box-sizing:border-box}
#rh-config [hidden]{display:none!important}
#rh-config button,#rh-config input,#rh-config select,#rh-config textarea{font:inherit}
#rh-config button{color:inherit;cursor:inherit}
#rh-config button:disabled{opacity:.4;cursor:not-allowed}
#rh-config button:not(:disabled),#rh-config label:has(input[type=file]){cursor:var(--cursor-interaction,pointer)}
#rh-config h1,#rh-config h2,#rh-config h3,#rh-config p{margin:0}
#rh-config h1{font-size:29px;line-height:1.2;font-weight:600;letter-spacing:-.9px}
#rh-config h2{font-size:18px;font-weight:550;letter-spacing:-.3px}
#rh-config h3{font-size:15px;font-weight:550}
#rh-config small{font-size:12px}
#rh-config .rh-muted{color:var(--rh-dim)}
#rh-config .rh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:21px 27px;background:var(--rh-panel);border-bottom:1px solid var(--rh-line)}
#rh-config .rh-brand{display:flex;align-items:center;gap:11px;font-size:20px;letter-spacing:-.6px;font-weight:650}
#rh-config .rh-brand-mark{width:34px;height:34px;border-radius:10px;background:#1d4777;display:grid;place-items:center;color:#8fc7ff}
#rh-config .rh-topmeta{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--rh-dim)}
#rh-config .rh-demo{border:1px solid var(--rh-line);padding:4px 8px;border-radius:6px;font-size:11px;letter-spacing:1px;text-transform:uppercase}
#rh-config .rh-layout{display:grid;grid-template-columns:197px minmax(0,1fr)}
#rh-config .rh-sidebar{padding:25px 13px;background:var(--rh-panel);border-right:1px solid var(--rh-line);display:flex;flex-direction:column;gap:24px}
#rh-config .rh-nav{display:grid;gap:5px}
#rh-config .rh-nav button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:12px 13px;border:0;border-radius:9px;color:var(--rh-dim);background:transparent;font-size:13px}
#rh-config .rh-nav button[aria-current=page]{color:#fff;background:#1c3d66}
#rh-config .rh-nav button:hover{background:var(--rh-raised);color:var(--rh-text)}
#rh-config .rh-nav button[aria-current=page]:hover{background:#244b7b}
#rh-config .rh-device{margin-top:auto;padding:18px 10px 2px;border-top:1px solid var(--rh-line);font-size:12px;color:var(--rh-dim)}
#rh-config .rh-device strong{display:block;color:var(--rh-text);font-weight:500;margin:6px 0 3px}
#rh-config .rh-online{display:inline-block;width:6px;height:6px;background:#69d8b0;border-radius:50%;margin-right:6px}
#rh-config .rh-main{padding:27px;min-width:0}
#rh-config .rh-pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:25px 0 20px}
#rh-config .rh-pagehead p{margin-top:7px;color:var(--rh-dim);font-size:13px}
#rh-config .rh-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#rh-config .rh-spread{justify-content:space-between}
#rh-config .rh-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rh-line);border-radius:9px;padding:10px 14px;background:var(--rh-raised);font-size:13px;font-weight:500;text-decoration:none;min-height:40px;white-space:nowrap}
#rh-config .rh-button:hover{filter:brightness(1.12)}
#rh-config .rh-primary{background:var(--rh-blue);border-color:var(--rh-blue);color:#fff}
#rh-config .rh-quiet{background:transparent}
#rh-config .rh-danger{color:#ffaaa8;background:#45242d;border-color:#6d3540}
#rh-config .rh-iconbutton{padding:8px;min-width:36px;min-height:36px;border:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--rh-dim)}
#rh-config .rh-iconbutton:hover{background:var(--rh-raised);color:var(--rh-text)}
#rh-config .rh-iconbutton[aria-pressed=true]{color:#ffcf6b}
#rh-config .rh-hero{position:relative;border-radius:var(--rh-radius);overflow:hidden;background:#132944;min-height:154px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
#rh-config .rh-hero:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(9,21,39,.96),rgba(9,21,39,.70) 50%,rgba(9,21,39,.12)),var(--rh-coast) center 47%/cover}
#rh-config .rh-hero>*{position:relative;z-index:1}
#rh-config .rh-eyebrow{display:block;color:#b9c7db;letter-spacing:1.7px;font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:8px}
#rh-config .rh-playingname{font-size:23px;letter-spacing:-.5px;font-weight:550;color:#fff}
#rh-config .rh-playingmeta{font-size:12px;color:#bdcbdc;margin-top:4px}
#rh-config .rh-volume{display:flex;align-items:center;gap:10px;min-width:164px;background:#102138;padding:10px 12px;border:1px solid #344359;border-radius:12px;color:#fff}
#rh-config input[type=range]{accent-color:var(--rh-blue);min-width:0;width:100%}
#rh-config .rh-volume input{width:88px}
#rh-config .rh-volume output{font-size:12px;width:24px;font-variant-numeric:tabular-nums}
#rh-config .rh-list{background:var(--rh-panel);border:1px solid var(--rh-line);border-radius:var(--rh-radius);overflow:hidden}
#rh-config .rh-listhead{padding:13px 18px;border-bottom:1px solid var(--rh-line);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--rh-dim);display:flex;justify-content:space-between;gap:10px}
#rh-config .rh-station{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:13px;padding:17px 18px;border-bottom:1px solid var(--rh-line)}
#rh-config .rh-station:last-child{border-bottom:0}
#rh-config .rh-art{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:#26364f;border:1px solid #3b4c64;color:#e8f1ff;font-size:14px;font-weight:650;overflow:hidden;flex-shrink:0}
#rh-config .rh-art img{width:100%;height:100%;object-fit:contain}
#rh-config .rh-stationname{font-size:14px;font-weight:550;display:flex;align-items:center;gap:9px;overflow-wrap:anywhere}
#rh-config .rh-stationdesc{font-size:12px;color:var(--rh-dim);margin-top:3px}
#rh-config .rh-actions{display:flex;gap:3px;align-items:center}
#rh-config .rh-live{display:inline-flex;align-items:center;gap:4px;font-size:10px;letter-spacing:.6px;color:#8bc3ff;text-transform:uppercase}
#rh-config .rh-importline{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:15px;font-size:12px;color:var(--rh-dim)}
#rh-config .rh-box{background:var(--rh-panel);border:1px solid var(--rh-line);border-radius:var(--rh-radius);padding:21px;margin-top:16px}
#rh-config .rh-box:first-child{margin-top:0}
#rh-config .rh-box>p{font-size:13px;color:var(--rh-dim);margin-top:6px}
#rh-config .rh-field{display:grid;gap:7px;margin-top:19px;min-width:0;font-size:13px}
#rh-config .rh-field>span:first-child{font-weight:500}
#rh-config .rh-field input:not([type=range]):not([type=checkbox]),#rh-config .rh-field select,#rh-config .rh-field textarea{border:1px solid var(--rh-line);border-radius:8px;background:var(--rh-bg);color:var(--rh-text);padding:10px 12px;width:100%;min-width:0;min-height:43px}
#rh-config .rh-field textarea{resize:vertical;min-height:105px}
#rh-config .rh-field small{font-weight:400;color:var(--rh-dim)}
#rh-config .rh-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#rh-config .rh-note{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--rh-raised);color:var(--rh-dim);font-size:12px;margin-top:17px}
#rh-config .rh-note i,#rh-config .rh-note svg{flex-shrink:0;margin-top:2px}
#rh-config .rh-note.rh-warning{background:#372b23;color:#f3c798}
#rh-config .rh-note.rh-success{background:#13342e;color:#a3dfc9}
#rh-config .rh-footer{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:22px;margin-top:22px;border-top:1px solid var(--rh-line);flex-wrap:wrap}
#rh-config .rh-formstatus{margin-right:auto;font-size:12px;color:var(--rh-dim)}
#rh-config .rh-back{padding:0;display:inline-flex;gap:6px;align-items:center;border:0;background:none;color:var(--rh-dim);font-size:12px;margin-top:19px}
#rh-config .rh-steps{display:flex;gap:8px;color:var(--rh-dim);font-size:12px;align-items:center;flex-wrap:wrap;margin:16px 0}
#rh-config .rh-steps b{color:#8ec3ff;font-weight:500}
#rh-config .rh-search{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
#rh-config .rh-tabs{display:flex;gap:5px;padding:4px;border-radius:9px;background:var(--rh-bg);width:fit-content;margin:18px 0}
#rh-config .rh-tabs button{padding:8px 16px;background:transparent;border:0;color:var(--rh-dim);border-radius:6px;font-size:13px}
#rh-config .rh-tabs button[aria-pressed=true]{background:var(--rh-raised);color:var(--rh-text)}
#rh-config .rh-result{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border:1px solid var(--rh-line);border-radius:10px;background:var(--rh-panel);text-align:left;margin-top:9px}
#rh-config .rh-result:hover{border-color:var(--rh-blue)}
#rh-config .rh-result>span:nth-child(2){flex:1}
#rh-config .rh-result small{display:block;color:var(--rh-dim);margin-top:3px}
#rh-config .rh-inlinecheck{display:flex;gap:9px;align-items:center;font-size:13px;margin-top:17px}
#rh-config input[type=checkbox]{accent-color:var(--rh-blue);width:16px;height:16px;flex-shrink:0}
#rh-config .rh-preview{aspect-ratio:4/3;max-width:320px;margin:18px auto 0;border:5px solid #060c15;border-radius:11px;background-image:linear-gradient(#091c333b,#091c3380),var(--rh-coast);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#fff;box-shadow:0 9px 30px #0002}
#rh-config .rh-previewtop{display:flex;justify-content:space-between;gap:10px;font-size:12px}
#rh-config .rh-previewclock{font-size:34px;line-height:1.1;text-align:right;letter-spacing:-1px}
#rh-config .rh-previewtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#rh-config .rh-previewtiles span{display:grid;place-items:center;gap:5px;background:#253b56f2;border:1px solid #7187a17a;border-radius:7px;padding:10px 2px;font-size:9px;white-space:nowrap}
#rh-config .rh-previewtiles span:first-child{background:#0075e3e8}
#rh-config .rh-previewtiles span:nth-child(2){background:#07864ae8}
#rh-config .rh-previewtiles span:nth-child(3){background:#7644b6e8}
#rh-config .rh-previewlabel{text-align:center;margin-top:10px;font-size:11px;color:var(--rh-dim)}
#rh-config .rh-upload{display:flex;align-items:center;justify-content:center;gap:9px;border:1px dashed #50627c;border-radius:10px;padding:21px 12px;text-align:center;background:var(--rh-bg);font-size:13px;margin-top:20px;position:relative;overflow:hidden}
#rh-config .rh-upload input{position:absolute;inset:0;opacity:0;width:100%;cursor:inherit}
#rh-config .rh-data{display:grid;grid-template-columns:1fr 1fr;gap:13px;font-size:12px;margin-top:16px}
#rh-config .rh-data dt{color:var(--rh-dim)}
#rh-config .rh-data dd{margin:0;text-align:right;overflow-wrap:anywhere}
#rh-config details{border-top:1px solid var(--rh-line);padding-top:17px;margin-top:20px}
#rh-config summary{font-size:13px;cursor:var(--cursor-interaction,pointer)}
#rh-config .rh-log{font:11px/1.8 ui-monospace,monospace;white-space:pre-wrap;background:var(--rh-bg);border-radius:8px;padding:13px;margin-top:12px;color:var(--rh-dim)}
#rh-config .rh-toast{background:#184433;color:#d1f8e3;border:1px solid #347957;border-radius:9px;padding:12px 15px;font-size:13px;margin-top:15px;display:flex;gap:9px;align-items:center}
#rh-config .rh-overlay{position:absolute;inset:0;z-index:5;background:#050c18c7;display:flex;align-items:flex-start;justify-content:center;padding:95px 20px 30px}
#rh-config .rh-dialog{background:#f4f6fa;color:#162034;border-radius:18px;box-shadow:0 24px 80px #0006;padding:27px;max-width:430px;width:100%;font-size:14px}
#rh-config .rh-dialog h2{font-size:22px;margin-bottom:12px}
#rh-config .rh-dialog p{color:#566073;font-size:14px}
#rh-config .rh-dialog .rh-footer{border-color:#d8dce5}
#rh-config .rh-dialog .rh-button{background:#e1e5ed;border-color:#d6dce5;color:#233047}
#rh-config .rh-dialog .rh-danger{background:#d64d55;color:white;border-color:#d64d55}
#rh-config .rh-dialog .rh-primary{background:#2577dc;color:white;border-color:#2577dc}
#rh-config .rh-eq{background:var(--rh-panel);border-top:1px solid var(--rh-line);padding:15px 27px}
#rh-config .rh-eq summary{display:flex;justify-content:space-between;align-items:center;color:var(--rh-dim)}
#rh-config .rh-eq details{border:0;padding:0;margin:0}
#rh-config .rh-eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:0 0 10px}
#rh-config .rh-eqgrid .rh-field{margin-top:15px}
#rh-config .rh-empty{text-align:center;padding:32px;color:var(--rh-dim)}
#rh-config .rh-mobiletitle{display:none}
@media(max-width:780px){#rh-config .rh-layout{grid-template-columns:165px minmax(0,1fr)}#rh-config .rh-main{padding:20px}#rh-config .rh-sidebar{padding:20px 9px}#rh-config .rh-nav button{font-size:12px;padding:11px 9px;gap:8px}#rh-config .rh-hero{padding:19px;align-items:flex-start;flex-direction:column;gap:15px}#rh-config .rh-volume{min-width:190px}#rh-config .rh-volume input{width:110px}#rh-config .rh-grid2{grid-template-columns:1fr}#rh-config .rh-top{padding:18px 20px}#rh-config .rh-pagehead{flex-wrap:wrap}#rh-config .rh-station{padding:15px 12px;gap:9px}#rh-config .rh-stationname{flex-wrap:wrap;gap:3px}#rh-config .rh-importline{flex-wrap:wrap}}
@media(max-width:560px){#rh-config .rh-layout{display:block}#rh-config .rh-sidebar{border-right:0;border-bottom:1px solid var(--rh-line);padding:10px 12px}#rh-config .rh-nav{grid-template-columns:repeat(5,1fr);gap:3px}#rh-config .rh-nav button{flex-direction:column;gap:6px;padding:10px 2px;text-align:center;font-size:10px;line-height:1.25;min-height:55px}#rh-config .rh-nav .rh-desktoplabel{display:none}#rh-config .rh-mobiletitle{display:inline}#rh-config .rh-device{display:none}#rh-config .rh-top{padding:15px 16px}#rh-config .rh-topmeta>span:first-child{display:none}#rh-config .rh-main{padding:16px}#rh-config h1{font-size:26px}#rh-config .rh-brand{font-size:18px}#rh-config .rh-demo{font-size:9px;letter-spacing:.5px}#rh-config .rh-hero{min-height:165px}#rh-config .rh-pagehead{margin:23px 0 17px;gap:12px}#rh-config .rh-station{grid-template-columns:38px minmax(0,1fr) auto;padding:14px 10px;gap:9px}#rh-config .rh-art{width:38px;height:38px;border-radius:8px}#rh-config .rh-stationdesc{font-size:11px}#rh-config .rh-stationname{font-size:13px}#rh-config .rh-actions{gap:0}#rh-config .rh-actions .rh-iconbutton{min-width:32px;padding:6px}#rh-config .rh-listhead{padding:12px;font-size:10px}#rh-config .rh-box{padding:16px}#rh-config .rh-button{font-size:12px;padding:10px 12px}#rh-config .rh-eq{padding:15px 16px}#rh-config .rh-eqgrid{gap:16px}#rh-config .rh-field input:not([type=range]),#rh-config .rh-field select,#rh-config .rh-field textarea{font-size:16px}#rh-config .rh-overlay{padding:80px 12px 20px}#rh-config .rh-dialog{padding:22px}#rh-config .rh-station .rh-actions{flex-direction:column}#rh-config .rh-station .rh-actions button{min-height:36px;min-width:36px}}
@media(pointer:coarse){#rh-config .rh-iconbutton{min-height:44px;min-width:44px}#rh-config .rh-station .rh-actions button{min-height:44px;min-width:44px}}
</style>
<div id="rh-config" aria-label="Radiohead web configuration mockup">
 <header class="rh-top"><div class="rh-brand"><span class="rh-brand-mark"><i data-lucide="radio" aria-hidden="true"></i></span>radiohead<span style="color:#62748c;font-weight:400">/</span><span style="font-size:13px;font-weight:400;letter-spacing:0;color:var(--rh-dim)">settings</span></div><div class="rh-topmeta"><span>Local to your radio</span><span class="rh-demo">Interactive demo</span></div></header>
 <div class="rh-layout">
  <aside class="rh-sidebar"><nav class="rh-nav" aria-label="Settings sections">
   <button type="button" data-nav="stations" aria-current="page"><i data-lucide="radio" aria-hidden="true"></i><span>Stations</span></button>
   <button type="button" data-nav="network"><i data-lucide="wifi" aria-hidden="true"></i><span>Network</span></button>
   <button type="button" data-nav="weather"><i data-lucide="cloud-sun" aria-hidden="true"></i><span class="rh-desktoplabel">Weather & time</span><span class="rh-mobiletitle">Weather<br>& time</span></button>
   <button type="button" data-nav="appearance"><i data-lucide="image" aria-hidden="true"></i><span>Appearance</span></button>
   <button type="button" data-nav="device"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span class="rh-desktoplabel">Device & maintenance</span><span class="rh-mobiletitle">Device</span></button>
  </nav><div class="rh-device"><span class="rh-online"></span><span id="rh-sideconnection">Connected · demo</span><strong>Radiohead</strong><span>radiohead.local · example</span></div></aside>
  <main class="rh-main">
   <section class="rh-hero" aria-label="Remote audio controls"><div><span class="rh-eyebrow" id="rh-playstate">Now playing · demo</span><div class="rh-playingname" id="rh-playingname">Galatz</div><div class="rh-playingmeta" id="rh-playingmeta">Live radio · גל״צ</div></div><div class="rh-volume"><button type="button" class="rh-iconbutton" id="rh-mute" aria-label="Mute radio" aria-pressed="false"><i data-lucide="volume-2" aria-hidden="true"></i></button><input id="rh-volume" type="range" min="0" max="100" value="42" aria-label="Radio volume"><output id="rh-volumeval" for="rh-volume">42</output></div></section>
   <div id="rh-notice" class="rh-toast" role="status" hidden></div>
   <div id="rh-page"></div>
  </main>
 </div>
 <section class="rh-eq"><details><summary><span class="rh-row"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>Sound · custom tone</span><i data-lucide="chevron-down" aria-hidden="true"></i></summary><div class="rh-eqgrid"><label class="rh-field"><span class="rh-row rh-spread">Bass <output id="rh-bassval">0 dB</output></span><input type="range" min="-10" max="10" value="0" data-tone="bass" aria-label="Bass"></label><label class="rh-field"><span class="rh-row rh-spread">Mid <output id="rh-midval">0 dB</output></span><input type="range" min="-10" max="10" value="0" data-tone="mid" aria-label="Mid"></label><label class="rh-field"><span class="rh-row rh-spread">Treble <output id="rh-trebleval">0 dB</output></span><input type="range" min="-10" max="10" value="0" data-tone="treble" aria-label="Treble"></label></div><small class="rh-muted">Changes apply immediately in this demo. Also available on the radio.</small></details></section>
 <div id="rh-overlay" class="rh-overlay" hidden></div>
</div>
<script>
(()=>{
 const root=document.getElementById('rh-config'), page=root.querySelector('#rh-page'), notice=root.querySelector('#rh-notice'), overlay=root.querySelector('#rh-overlay');
 const ico=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const button=(text,action,kind='',icon='')=>`<button type="button" class="rh-button ${kind}" data-action="${action}">${icon?ico(icon):''}${text}</button>`;
 const field=(label,content,hint='')=>`<label class="rh-field"><span>${label}</span>${content}${hint?`<small>${hint}</small>`:''}</label>`;
 const head=(title,sub,actions='')=>`<div class="rh-pagehead"><div><h1>${title}</h1><p>${sub}</p></div>${actions}</div>`;
 const note=(text,type='',icon='info')=>`<div class="rh-note ${type}">${ico(icon)}<span>${text}</span></div>`;
 const foot=(action,label='Save changes')=>`<div class="rh-footer"><span class="rh-formstatus" id="rh-draftstatus">No changes yet</span>${button('Cancel','cancel','rh-quiet')}${button(label,action,'rh-primary')}</div>`;
 const art=s=>`<span class="rh-art">${s.image?`<img src="${s.image}" alt="">`:esc(s.mark||s.name.slice(0,2).toUpperCase())}</span>`;

 function render(){root.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===state.section)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});renderPlayer();for(const k of ['bass','mid','treble']){root.querySelector(`[data-tone=${k}]`).value=state.tone[k];root.querySelector('#rh-'+k+'val').textContent=(state.tone[k]>0?'+':'')+state.tone[k]+' dB'}if(state.section==='stations')renderStations();if(state.section==='network')renderNetwork();if(state.section==='weather')renderWeather();if(state.section==='appearance')renderAppearance();if(state.section==='device')renderDevice();icons();}
 function navigate(section){const go=()=>{state.section=section;state.view='list';dirty=false;draft=null;clearNotice();render();persist()};if(dirty)confirm('Discard unsaved changes?','Your saved settings will stay as they are.','Discard changes',go,true);else go();}
 function renderStations(){if(state.view==='discover')return renderDiscover();if(state.view==='edit')return renderEditor();if(state.view==='import')return renderImport();page.innerHTML=head('Stations','A familiar collection. A new discovery.',button('Add station','add','rh-primary','plus'))+`<div class="rh-list"><div class="rh-listhead"><span>Saved on your radio</span><span>${state.stations.length} / 10 stations</span></div>${state.stations.map(s=>`<div class="rh-station">${art(s)}<div><div class="rh-stationname">${esc(s.name)}${state.playing===s.id?'<span class="rh-live">• Playing</span>':''}</div><div class="rh-stationdesc">${esc(s.desc)}</div></div><div class="rh-actions"><button class="rh-iconbutton" data-favorite="${s.id}" type="button" aria-label="${s.favorite?'Remove':'Add'} ${esc(s.name)} ${s.favorite?'from':'to'} favorites" aria-pressed="${s.favorite}">${ico('star')}</button><button class="rh-iconbutton" data-edit="${s.id}" type="button" aria-label="Edit ${esc(s.name)}">${ico('pencil')}</button></div></div>`).join('')||'<div class="rh-empty">No saved stations. Add your first station above.</div>'}</div><div class="rh-importline"><span>Favorites appear on your radio, too.</span>${button('Import M3U','import','rh-quiet','upload')}</div>`;if(state.stations.length>=10){page.querySelector('[data-action=add]').disabled=true;page.insertAdjacentHTML('beforeend',note('All 10 slots are full. Edit or remove a saved station to make room.'));}}
 function renderDiscover(){page.innerHTML=`<button class="rh-back" data-action="cancel">${ico('arrow-left')} Stations</button>`+head('Find your next station','Search without interrupting what’s playing.')+`<div class="rh-steps"><b>1 · Find</b><span>—</span><span>2 · Review & test</span><span>—</span><span>3 · Save</span></div><div class="rh-box"><h2>Add a station</h2><div class="rh-tabs"><button type="button" aria-pressed="true" data-action="search-mode">Search directory</button><button type="button" aria-pressed="false" data-action="manual">Enter manually</button></div><div class="rh-search">${field('Station name','<input id="rh-query" maxlength="80" value="BBC Radio 4" placeholder="Search by name" autocomplete="off">')}${button('Search','search','rh-primary','search')}</div><div class="rh-grid2">${field('Country','<select id="rh-country"><option>Any country</option><option>United Kingdom</option><option>Israel</option></select>')}${field('Language','<select id="rh-language"><option>Any language</option><option>English</option><option>Hebrew</option></select>')}</div><div id="rh-results" aria-live="polite">${note(design.scenario==='Setup mode'?'Your phone is connected to the radio’s setup network. Directory search needs internet; manual entry and local artwork upload still work.':'Sample directory results for this prototype. Stream URLs and playback tests are simulated.','','info')}</div></div>`;}
 function search(){const query=page.querySelector('#rh-query').value.trim();const box=page.querySelector('#rh-results');if(!query){box.innerHTML=note('Enter a station name to search.','rh-warning');icons();return}if(design.scenario==='Setup mode'||design.scenario==='Directory unavailable'){box.innerHTML=note('The station directory is unavailable. Try again when internet returns, or enter a stream URL manually.','rh-warning')+button('Enter manually','manual','rh-quiet');icons();return}const country=page.querySelector('#rh-country').value,language=page.querySelector('#rh-language').value;const bbc=/bbc|radio 4/i.test(query),kan=/kan|כאן/i.test(query);let results=bbc?[{name:'BBC Radio 4',desc:'United Kingdom · English · codec unverified',mark:'R4',url:'https://stream.example/bbc-radio-4'},{name:'BBC Radio 4 Extra',desc:'United Kingdom · English · codec unverified',mark:'4X',url:'https://stream.example/bbc-radio-4-extra'}]:kan?[{name:'Kan 88',desc:'Israel · Hebrew · codec unverified',mark:'88',url:'https://stream.example/kan-88'}]:[];results=results.filter(s=>(country==='Any country'||s.desc.includes(country))&&(language==='Any language'||s.desc.includes(language)));draft={results};box.innerHTML=results.length?`<div style="margin-top:22px" class="rh-row rh-spread"><h3>Suggested matches</h3><small class="rh-muted">Sample results · not tested</small></div>${results.map((s,i)=>`<button type="button" class="rh-result" data-result="${i}">${art(s)}<span>${esc(s.name)}<small>${esc(s.desc)}</small></span>${ico('chevron-right')}</button>`).join('')}`:note('No matching sample stations. Try “BBC Radio 4” or “Kan”, or enter the station manually.')+button('Enter manually','manual','rh-quiet');icons();}
 function openEditor(s=null){editId=s?.id||null;draft=s?{...s}:{name:'',url:'',mark:'',desc:'Manual station',favorite:false};logo=s?.image||'';logoMode='contain';state.view='edit';dirty=false;renderEditor();icons();}
 function renderEditor(){page.innerHTML=`<button class="rh-back" data-action="cancel">${ico('arrow-left')} Stations</button>`+head(editId?'Edit station':'Make it yours',editId?'Update the details saved on your radio.':'Review the details, then save to your radio.')+(!editId?'<div class="rh-steps"><span>1 · Find</span><span>—</span><b>2 · Review & test</b><span>—</span><span>3 · Save</span></div>':'')+`<div class="rh-box">${field('Station name',`<input id="rh-name" maxlength="80" dir="auto" value="${esc(draft.name)}" placeholder="Station name">`)}${field('Stream URL',`<input id="rh-stream" type="url" value="${esc(draft.url)}" placeholder="https://…" spellcheck="false">`,'Use a direct audio stream, not a station’s website. Sample URLs end in .example.')}<div class="rh-grid2"><div>${field('Logo URL (optional)','<input id="rh-logourl" type="url" placeholder="https://…/logo.png" spellcheck="false">','Directory logos are suggestions. Upload your own if a logo cannot load.')}<label class="rh-upload">${ico('upload')}<span>Upload a station logo</span><input id="rh-logo-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Upload station logo"></label></div><div class="rh-field"><span>Artwork preview</span><div class="rh-row"><span class="rh-art" id="rh-logo-preview" style="width:76px;height:76px;font-size:24px">${logo?`<img src="${logo}" alt="Station logo">`:esc(draft.mark||'—')}</span><div>${field('Image framing','<select id="rh-logo-mode"><option value="contain">Fit with padding</option><option value="cover">Center crop</option></select>')}</div></div><small>Saved artwork stays available after reboot.</small></div></div><label class="rh-inlinecheck"><input id="rh-stationfavorite" type="checkbox" ${draft.favorite?'checked':''}>Add to favorites</label><div id="rh-editorstatus" aria-live="polite"></div><div class="rh-note">${ico('radio')}<span><strong>Test on radio changes playback.</strong> Browsing, editing and saving keep your current station playing.</span></div><div class="rh-row" style="margin-top:14px">${button('Test on radio','test','rh-quiet','play')}<small class="rh-muted" id="rh-teststate">Not tested on this device</small></div>${foot('save-station','Save station')}${editId?`<div style="margin-top:20px">${button('Remove station','delete-station','rh-danger','trash-2')}</div>`:''}</div>`;}
 function readDraft(){draft={...draft,name:page.querySelector('#rh-name').value.trim(),url:page.querySelector('#rh-stream').value.trim(),favorite:page.querySelector('#rh-stationfavorite').checked};return draft;}
 function validateStation(){readDraft();const result=page.querySelector('#rh-editorstatus');if(!draft.name){result.innerHTML=note('Give this station a name.','rh-warning');page.querySelector('#rh-name').focus();icons();return false}try{const u=new URL(draft.url);if(!['http:','https:'].includes(u.protocol))throw 0;}catch{result.innerHTML=note('Enter a valid HTTP or HTTPS stream URL.','rh-warning');page.querySelector('#rh-stream').focus();icons();return false}return true;}
 function testStation(){if(!validateStation())return;state.playing=-1;state.playingName=draft.name;renderPlayer();page.querySelector('#rh-teststate').textContent='Demo test: playback successful';page.querySelector('#rh-editorstatus').innerHTML=note('Simulated test completed. Save when you’re happy with the details.','rh-success','check');icons();}
 function saveStation(){if(!validateStation())return;if(design.scenario==='Newer radio changes'){page.querySelector('#rh-editorstatus').innerHTML=note('This station changed on the radio while you were editing. Your draft has been kept. Reload the saved version before editing again.','rh-warning')+button('Reload saved version','reload-station','rh-quiet');icons();return}if(!editId&&state.stations.length>=10){toast('All 10 station slots are full.');return}const s={...draft,id:editId||Date.now(),image:logo,mark:draft.mark||draft.name.slice(0,2).toUpperCase(),desc:draft.desc||'Manual station'};if(editId)state.stations=state.stations.map(x=>x.id===editId?s:x);else state.stations.push(s);if(state.playing===-1&&state.playingName===s.name)state.playing=s.id;state.view='list';dirty=false;render();toast(`${s.name} saved in this demo. ${logo?'Artwork saved, too.':(page.querySelector('#rh-logourl')?.value?'Artwork URL could not be loaded in this offline demo; using a placeholder.':'Using a placeholder until artwork is added.')}`);persist();}
 function renderImport(){page.innerHTML=`<button class="rh-back" data-action="cancel">${ico('arrow-left')} Stations</button>`+head('Import stations','Preview your playlist before adding anything.')+`<div class="rh-box"><h2>M3U playlist</h2><label class="rh-upload">${ico('upload')}<span>Choose an .m3u file</span><input id="rh-m3u-file" type="file" accept=".m3u,.m3u8" aria-label="Choose M3U playlist"></label>${field('Or paste a playlist','<textarea id="rh-m3u" placeholder="#EXTM3U&#10;#EXTINF:-1,My station&#10;https://…"></textarea>')}<div class="rh-row" style="margin-top:16px">${button('Preview import','preview-import','rh-primary')}</div><div id="rh-importpreview" aria-live="polite"></div></div>`;}
 function previewImport(){let name='',entries=[];page.querySelector('#rh-m3u').value.split(/\r?\n/).forEach(line=>{line=line.trim();if(line.startsWith('#EXTINF:'))name=line.split(',').slice(1).join(',').trim();else if(/^https?:\/\//i.test(line)){try{const url=new URL(line);entries.push({name:name||url.hostname,url:line,mark:'FM',desc:'Imported station',favorite:false});name=''}catch{}}});pendingEntries=entries.filter((s,i)=>!state.stations.some(x=>x.url===s.url)&&entries.findIndex(x=>x.url===s.url)===i);const available=10-state.stations.length;page.querySelector('#rh-importpreview').innerHTML=pendingEntries.length?note(`${pendingEntries.length} new stations found · ${available} free slots. Existing stations are kept.`)+(pendingEntries.length>available?note('This playlist exceeds the available slots. Trim it and preview again. Nothing will be replaced.','rh-warning'):`<div style="margin-top:14px">${pendingEntries.map(s=>`<p style="margin:8px 0">${esc(s.name)}</p>`).join('')}</div><div class="rh-footer">${button('Cancel','cancel','rh-quiet')}${button('Import '+pendingEntries.length+' stations','commit-import','rh-primary')}</div>`):note('No new valid streams found. Check the playlist, or remove duplicate URLs.','rh-warning');icons();}
 function renderNetwork(){const setup=design.scenario==='Setup mode';page.innerHTML=head('Network','Keep your radio connected.')+`<div class="rh-box"><div class="rh-row rh-spread"><div class="rh-row">${ico('wifi')}<h2>${setup?'Wi-Fi setup':esc(state.network)}</h2></div><small style="color:#77cfae">${setup?'Setup mode':'Connected · demo'}</small></div><p>${setup?'Join the radio’s setup network from your phone, then choose your home Wi-Fi.':'Your radio and browser are on the same network.'}</p><dl class="rh-data"><dt>${setup?'Setup network':'Signal'}</dt><dd>${setup?'Radiohead-Setup · example':'Strong · −52 dBm · demo'}</dd><dt>Local address</dt><dd>${setup?'192.168.4.1 · example':'radiohead.local · example'}</dd></dl>${!setup?`<div class="rh-row" style="margin-top:18px">${button('Retry connection','retry','rh-quiet','refresh-cw')}${button('Forget network','forget','rh-quiet')}</div>`:''}</div><div class="rh-box"><div class="rh-row rh-spread"><h2>${setup?'Connect to Wi-Fi':'Change Wi-Fi'}</h2>${button('Scan again','scan','rh-quiet','refresh-cw')}</div>${field('Network','<select id="rh-network"><option>Home Wi-Fi</option><option>Studio</option><option value="hidden">Hidden network…</option></select>')}<div id="rh-hiddennetwork" hidden>${field('Network name','<input id="rh-ssid" autocomplete="off" placeholder="Exact Wi-Fi network name">')}</div>${field('Wi-Fi password','<input id="rh-password" type="password" autocomplete="new-password" placeholder="Enter password">')}<label class="rh-inlinecheck"><input type="checkbox" id="rh-showpassword">Show password</label>${note('Changing Wi-Fi may disconnect this page. If it does, join the new network and reopen the radio’s address.')}<div id="rh-networkstatus" aria-live="polite"></div>${foot('connect','Connect')}</div>`;}
 function connect(){const sel=page.querySelector('#rh-network').value,net=sel==='hidden'?page.querySelector('#rh-ssid').value.trim():sel,pass=page.querySelector('#rh-password').value;const out=page.querySelector('#rh-networkstatus');if(!net||pass.length<8){out.innerHTML=note(!net?'Enter the network name.':'Enter a password with at least 8 characters for this sample network.','rh-warning');icons();return}page.querySelector('#rh-password').value='';if(design.scenario==='Wi-Fi fails'){out.innerHTML=note('Couldn’t connect. Check the password and try again. The radio remains available in setup mode.','rh-warning');icons();return}state.network=net;dirty=false;out.innerHTML=note(`Connected to ${esc(net)} in this demo. In a real setup, join ${esc(net)} on your phone, then reopen the address shown on your radio.`,'rh-success','check');page.querySelector('#rh-draftstatus').textContent='Connection saved · demo';icons();}
 function renderWeather(){const w=state.weather;page.innerHTML=head('Weather & time','A little local context for your radio.')+`<div class="rh-box"><h2>Weather</h2>${field('Location',`<input id="rh-location" value="${esc(w.location)}" placeholder="City, country" autocomplete="off">`,'Used for weather only. The time zone is set separately.')}<div class="rh-grid2">${field('Units',`<select id="rh-units"><option value="C" ${w.units==='C'?'selected':''}>Celsius · °C</option><option value="F" ${w.units==='F'?'selected':''}>Fahrenheit · °F</option></select>`)}${field('Provider','<select><option>OpenWeather</option></select>')}</div><label class="rh-inlinecheck"><input id="rh-weathervisible" type="checkbox" ${w.visible?'checked':''}>Show weather on the radio’s Home screen</label><details><summary>Provider access</summary>${field('API key','<input id="rh-apikey" type="password" autocomplete="new-password" placeholder="Configured · enter a new key to replace">','The saved key is never returned to the page. This demo does not store entered keys.')}</details></div><div class="rh-box"><h2>Clock</h2><div class="rh-grid2">${field('Time zone',`<select id="rh-timezone">${[['Asia/Jerusalem','Jerusalem'],['Europe/London','London'],['Europe/Berlin','Berlin'],['America/New_York','New York'],['UTC','UTC']].map(([v,l])=>`<option value="${v}" ${w.timezone===v?'selected':''}>${l} · ${v}</option>`).join('')}</select>`)}${field('Clock format',`<select id="rh-format"><option value="24" ${w.format==='24'?'selected':''}>24-hour · 14:37</option><option value="12" ${w.format==='12'?'selected':''}>12-hour · 2:37 PM</option></select>`)}</div>${note('Regional time zones follow daylight saving time. The chosen time appears on the TFT.')}<div id="rh-weatherstatus" aria-live="polite"></div>${foot('save-weather')}</div>`;}
 function renderAppearance(){backgroundDraft=state.background;backgroundMode=state.backgroundMode||'cover';backgroundPosition=state.backgroundPosition??50;page.innerHTML=head('Appearance','Your view, with the same familiar controls.')+`<div class="rh-box"><div class="rh-grid2"><div><h2>Radio background</h2><p class="rh-muted" style="font-size:13px;margin-top:8px">Bring your own image. Preview how it sits behind the clock and controls.</p><label class="rh-upload">${ico('upload')}<span>Choose a background image</span><input id="rh-background-file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Choose background image"></label><small class="rh-muted" style="display:block;margin-top:9px">PNG, JPG or WebP · prepared for 320 × 240</small>${field('Image framing','<select id="rh-backgroundmode"><option value="cover">Fill screen · crop to fit</option><option value="contain">Fit entire image</option></select>')}${field('Crop position','<input id="rh-cropposition" type="range" min="0" max="100" value="50" aria-label="Background crop position">')}<div style="margin-top:20px">${button('Restore default','restore-background','rh-quiet','rotate-ccw')}</div></div><div><div class="rh-preview" id="rh-backgroundpreview" aria-label="TFT background preview"><div class="rh-previewtop"><span>Radiohead</span>${ico('wifi')}</div><div class="rh-row rh-spread"><span style="font-size:18px">☀ 28°<small style="display:block;font-size:10px">${esc(state.weather.location.split(',')[0])} · sample</small></span><span class="rh-previewclock">${state.weather.format==='12'?'2:37':'14:37'}</span></div><div class="rh-previewtiles"><span>${ico('radio')}Live Radio</span><span>${ico('list-music')}Shows</span><span>${ico('heart')}Favorites</span><span>${ico('settings')}Settings</span></div></div><div class="rh-previewlabel">TFT preview · 320 × 240 · sample data</div></div></div><div id="rh-backgroundstatus" aria-live="polite"></div>${note('Text and controls stay readable over your image. The previous background stays in place until a new upload succeeds.')}${foot('save-background','Save background')}</div>`;page.querySelector('#rh-backgroundmode').value=backgroundMode;page.querySelector('#rh-cropposition').value=backgroundPosition;updateBgPreview();}
 function updateBgPreview(){const p=page.querySelector('#rh-backgroundpreview');if(!p)return;p.style.backgroundImage=backgroundDraft?`linear-gradient(#091c3340,#091c3380),url("${backgroundDraft}")`:'linear-gradient(#091c333b,#091c3380),var(--rh-coast)';p.style.backgroundSize=backgroundMode;p.style.backgroundRepeat='no-repeat';p.style.backgroundColor='#0c1c31';p.style.backgroundPosition=backgroundPosition+'% '+backgroundPosition+'%';}
 function renderDevice(){page.innerHTML=head('Device & maintenance','Updates and the details behind the music.')+`<div class="rh-box"><h2>Radiohead</h2><dl class="rh-data"><dt>Firmware</dt><dd>Development build · demo</dd><dt>Device</dt><dd>ESP32-S3</dd><dt>Web address</dt><dd>radiohead.local · example</dd></dl></div><div class="rh-box"><h2>Firmware update</h2><p>Choose a firmware file, then review before updating.</p><label class="rh-upload">${ico('upload')}<span id="rh-firmwarelabel">Choose firmware .bin</span><input id="rh-firmware" type="file" accept=".bin" aria-label="Choose firmware file"></label><div id="rh-firmwarestatus" aria-live="polite"></div><div class="rh-row" style="margin-top:15px"><button type="button" class="rh-button rh-primary" data-action="firmware" disabled>Review update</button></div></div><div class="rh-box"><h2>Diagnostics</h2><p>Connection, storage and playback information.</p><details><summary>Open diagnostics</summary><dl class="rh-data"><dt>Network</dt><dd>${esc(state.network)} · demo</dd><dt>Stream state</dt><dd>${state.muted?'Playing, muted':'Playing'} · demo</dd><dt>Free memory</dt><dd>Not measured</dd><dt>Asset storage</dt><dd>Not measured</dd><dt>Service timing</dt><dd>Not measured</dd><dt>Touch calibration</dt><dd>Run on the radio</dd></dl><pre class="rh-log">Sample log — no live device connection\n14:36:58  Wi-Fi connected\n14:37:00  Stream started\n14:37:01  Audio playing</pre></details></div><div class="rh-box"><h2>Device actions</h2><div class="rh-row rh-spread" style="margin-top:16px"><div><h3>Restart radio</h3><small class="rh-muted">Interrupts playback. Keeps your settings.</small></div>${button('Restart','restart','rh-quiet')}</div><div class="rh-row rh-spread" style="margin-top:22px;border-top:1px solid var(--rh-line);padding-top:20px"><div><h3>Factory reset</h3><small class="rh-muted">Erase configuration. Keep touch calibration.</small></div>${button('Factory reset','reset','rh-danger')}</div></div>`;}
 function confirm(title,body,label,onConfirm,danger=false){returnFocus=document.activeElement;overlay.hidden=false;overlay.innerHTML=`<section class="rh-dialog" role="dialog" aria-modal="true" aria-labelledby="rh-dialogtitle"><h2 id="rh-dialogtitle">${esc(title)}</h2><p>${body}</p><div class="rh-footer">${button('Cancel','close-dialog','rh-quiet')}<button type="button" id="rh-confirm" class="rh-button ${danger?'rh-danger':'rh-primary'}">${esc(label)}</button></div></section>`;root.querySelector('.rh-layout').inert=true;root.querySelector('.rh-eq').inert=true;overlay.querySelector('[data-action=close-dialog]').focus();overlay.querySelector('#rh-confirm').onclick=()=>{closeDialog();onConfirm()};icons();}
 function closeDialog(){overlay.hidden=true;overlay.innerHTML='';root.querySelector('.rh-layout').inert=false;root.querySelector('.rh-eq').inert=false;if(returnFocus?.isConnected)returnFocus.focus();}
 overlay.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Tab'){const els=[...overlay.querySelectorAll('button')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.favorite){const s=state.stations.find(s=>s.id===Number(b.dataset.favorite));s.favorite=!s.favorite;renderStations();icons();toast(`${s.name} ${s.favorite?'added to':'removed from'} favorites in this demo.`);return}if(b.dataset.edit){openEditor(state.stations.find(s=>s.id===Number(b.dataset.edit)));return}if(b.dataset.result){const s=draft.results[Number(b.dataset.result)];openEditor(s);return}const a=b.dataset.action;if(!a)return;if(a==='cancel'){navigate(state.section);return}if(a==='close-dialog'){closeDialog();return}if(a==='add'){if(state.stations.length>=10)return;state.view='discover';clearNotice();render();}if(a==='manual')openEditor();if(a==='search')search();if(a==='test')testStation();if(a==='save-station')saveStation();if(a==='reload-station'){const saved=state.stations.find(s=>s.id===editId);openEditor(saved||null);toast('Saved version loaded. The previous draft was discarded.');}if(a==='delete-station'){const s=state.stations.find(s=>s.id===editId);confirm(`Remove ${s.name}?`,`This removes the saved station, its favorite and its artwork. ${state.playing===s.id?'Current playback stops.':'Your other stations stay as they are.'}`,'Remove station',()=>{state.stations=state.stations.filter(x=>x.id!==s.id);if(state.playing===s.id){state.playing=null;state.playingName='Nothing playing';}state.view='list';dirty=false;render();toast(`${s.name} removed in this demo.`)},true)}if(a==='import'){state.view='import';clearNotice();render();}if(a==='preview-import')previewImport();if(a==='commit-import'){if(state.stations.length+pendingEntries.length>10)return;pendingEntries.forEach((s,i)=>state.stations.push({...s,id:Date.now()+i}));state.view='list';dirty=false;render();toast('Stations imported in this demo. Existing stations were kept.');}if(a==='scan')toast('Demo scan complete. Choose a network below.');if(a==='retry')toast('Demo reconnect complete. The radio is online.');if(a==='forget')confirm(`Forget ${state.network}?`,'The radio will disconnect. Reconnect through its setup network to add Wi-Fi again.','Forget network',()=>{design.scenario='Setup mode';dirty=false;applyDesign();renderNetwork();icons();toast('Network forgotten in this demo. Setup mode is available.');},true);if(a==='connect')connect();if(a==='save-weather'){const location=page.querySelector('#rh-location').value.trim();if(!location){page.querySelector('#rh-weatherstatus').innerHTML=note('Enter a city and country.','rh-warning');icons();return}state.weather={location,timezone:page.querySelector('#rh-timezone').value,format:page.querySelector('#rh-format').value,units:page.querySelector('#rh-units').value,visible:page.querySelector('#rh-weathervisible').checked};page.querySelector('#rh-apikey').value='';dirty=false;renderWeather();icons();toast('Weather and time settings saved in this demo.');persist();}if(a==='restore-background'){backgroundDraft='';backgroundMode='cover';backgroundPosition=50;page.querySelector('#rh-backgroundmode').value='cover';page.querySelector('#rh-cropposition').value=50;updateBgPreview();markDirty();}if(a==='save-background'){if(design.scenario==='Storage full'){page.querySelector('#rh-backgroundstatus').innerHTML=note('Not enough storage. The previous background is still active. Choose a smaller image and try again.','rh-warning');icons();return}state.background=backgroundDraft;state.backgroundMode=backgroundMode;state.backgroundPosition=Number(backgroundPosition);dirty=false;page.querySelector('#rh-draftstatus').textContent='Saved · demo';toast('Background saved in this demo. Station artwork is unchanged.');}if(a==='firmware')confirm('Update firmware?','Demo only. On the radio, keep power connected until writing is complete. The TFT and browser show progress together.','Simulate update',()=>{page.querySelector('#rh-firmwarestatus').innerHTML=note('Demo update completed · radio restarted. Firmware has not been sent to a device.','rh-success','check');icons();});if(a==='restart')confirm('Restart radio?','Playback will stop while the radio restarts. Your stations, Wi-Fi and settings will be kept.','Restart',()=>toast('Demo restart completed. Your settings were kept.'));if(a==='reset')confirm('Reset this radio?','Proposed reset scope: erase Wi-Fi, stations, favorites, weather credentials and preferences. Remove custom artwork and background; restore the bundled background. Touch calibration is kept.','Reset demo',()=>{state.stations=[];state.playing=null;state.playingName='Nothing playing';state.network='Not configured';state.background='';state.weather={location:'',timezone:'Asia/Jerusalem',format:'24',units:'C',visible:false};state.tone={bass:0,mid:0,treble:0};state.section='network';design.scenario='Setup mode';dirty=false;applyDesign();render();toast('Demo configuration reset. Touch calibration is kept.');},true);});
 root.querySelector('#rh-mute').addEventListener('click',()=>{state.muted=!state.muted;renderPlayer();icons();persist()});
 root.querySelector('#rh-volume').addEventListener('input',e=>{state.volume=Number(e.target.value);root.querySelector('#rh-volumeval').textContent=state.volume;persist()});
 root.querySelectorAll('[data-tone]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.tone;state.tone[k]=Number(el.value);root.querySelector('#rh-'+k+'val').textContent=(el.value>0?'+':'')+el.value+' dB';persist()}));
 page.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='rh-query'){e.preventDefault();search()}});
 page.addEventListener('input',e=>{if(!['rh-query','rh-country','rh-language','rh-showpassword'].includes(e.target.id))markDirty();if(e.target.id==='rh-cropposition'){backgroundPosition=e.target.value;updateBgPreview()}if(['rh-name','rh-stream'].includes(e.target.id)){const s=page.querySelector('#rh-teststate');if(s)s.textContent='Not tested with these details';}});
 page.addEventListener('change',async e=>{const el=e.target;if(el.id==='rh-logourl'&&el.value){page.querySelector('#rh-editorstatus').innerHTML=note('Remote artwork cannot load in this offline demo. Upload a local image or save with the placeholder.','rh-warning');icons()}if(el.id==='rh-showpassword')page.querySelector('#rh-password').type=el.checked?'text':'password';if(el.id==='rh-network'){page.querySelector('#rh-hiddennetwork').hidden=el.value!=='hidden';markDirty()}if(el.id==='rh-logo-mode'){logoMode=el.value;const img=page.querySelector('#rh-logo-preview img');if(img)img.style.objectFit=logoMode;markDirty()}if(el.id==='rh-backgroundmode'){backgroundMode=el.value;updateBgPreview();markDirty()}if(el.id==='rh-logo-file'||el.id==='rh-background-file'){const file=el.files[0];if(!file)return;const output=page.querySelector(el.id==='rh-logo-file'?'#rh-editorstatus':'#rh-backgroundstatus');if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024){output.innerHTML=note('Choose a valid PNG, JPG or WebP under 8 MB for this demo.','rh-warning');icons();return}const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');const isLogo=el.id==='rh-logo-file';canvas.width=isLogo?176:640;canvas.height=isLogo?176:480;const ctx=canvas.getContext('2d');const scale=Math.min(canvas.width/image.width,canvas.height/image.height);ctx.fillStyle='#14243a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,(canvas.width-image.width*scale)/2,(canvas.height-image.height*scale)/2,image.width*scale,image.height*scale);const data=canvas.toDataURL('image/jpeg',.87);if(isLogo){logo=String(reader.result);page.querySelector('#rh-logo-preview').innerHTML=`<img src="${logo}" style="object-fit:${logoMode}" alt="Uploaded station logo">`;}else{backgroundDraft=String(reader.result);updateBgPreview()}markDirty();output.innerHTML=note('Image ready to preview. Save to apply in this demo.','','image');icons();};image.onerror=()=>{output.innerHTML=note('This image could not be read. Choose another file.','rh-warning');icons()};image.src=String(reader.result)};reader.readAsDataURL(file);}if(el.id==='rh-m3u-file'&&el.files[0]){if(el.files[0].size>256*1024){toast('Choose a playlist under 256 KB for this demo.');return}page.querySelector('#rh-m3u').value=await el.files[0].text();markDirty();previewImport();}if(el.id==='rh-firmware'&&el.files[0]){const f=el.files[0],valid=/\.bin$/i.test(f.name)&&f.size>0;page.querySelector('#rh-firmwarelabel').textContent=f.name;page.querySelector('[data-action=firmware]').disabled=!valid;page.querySelector('#rh-firmwarestatus').innerHTML=note(valid?'File selected. Compatibility is checked by the real device before writing.':'Choose a non-empty .bin firmware file.',valid?'':'rh-warning');icons();}});
 applyDesign();render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();if(!dirty)render();persist();}});tweak.addSelect(design,'appearance',{label:'Web appearance',options:['TFT navy','Light companion']});tweak.addToggle(design,'photograph',{label:'Coastal photograph'});tweak.addSlider(design,'radius',{label:'Surface corners',min:8,max:22,step:2,unit:'px'});tweak.addSelect(design,'scenario',{label:'Explore a UX state',options:['Connected','Setup mode','Directory unavailable','Wi-Fi fails','Storage full','Newer radio changes']});}
})();
</script>
