<div id="radio-study" aria-label="Radiohead touch and encoder concept">
  <style>
    #radio-study { --rh-bg:light-dark(#eeeadf,#191d1a); --rh-ink:light-dark(#242923,#eeeadf); --rh-muted:light-dark(#586054,#b0b7a7); --rh-line:light-dark(#c7cbbb,#40483b); --rh-accent:light-dark(#526442,#bdd09b); --rh-soft:light-dark(#dfe3d3,#30392c); color:var(--rh-ink); font-family:Arial,Helvetica,sans-serif; width:100%; }
    #radio-study * { box-sizing:border-box; }
    #radio-study .study-title { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin:0 0 24px; font-size:11px; letter-spacing:2px; font-weight:500; color:var(--rh-muted); }
    #radio-study .instrument { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:38px; padding:12px 0; }
    #radio-study .panel { width:320px; height:240px; flex:0 0 320px; background:var(--rh-bg); position:relative; overflow:hidden; box-shadow:0 0 0 7px var(--rh-line); border-radius:2px; }
    #radio-study button { font:inherit; cursor:pointer; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    #radio-study .panel button { border:0; background:transparent; border-radius:0; padding:0; }
    #radio-study .status { height:32px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:12px; color:var(--rh-muted); font-variant-numeric:tabular-nums; }
    #radio-study .status .time { font-weight:600; color:var(--rh-ink); }
    #radio-study .hero { height:148px; padding:13px 16px 0; position:relative; }
    #radio-study .eyebrow { color:var(--rh-accent); font-size:11px; letter-spacing:1.8px; font-weight:600; display:block; margin-bottom:8px; }
    #radio-study .station { display:block; text-align:left; font-size:27px; line-height:1.04; font-weight:600; letter-spacing:-.8px; min-height:56px; width:100%; }
    #radio-study .metadata { display:block; margin-top:9px; font-size:14px; line-height:19px; color:var(--rh-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #radio-study .home-actions { height:60px; margin:0 16px; display:grid; grid-template-columns:1fr 1fr 1fr; align-items:center; border-top:1px solid var(--rh-line); gap:4px; }
    #radio-study .home-actions button { height:44px; font-size:14px; }
    #radio-study .home-actions button:first-child { text-align:left; }
    #radio-study .home-actions button:last-child { text-align:right; }
    #radio-study .home-actions .active { color:var(--rh-accent); }
    #radio-study .heading { height:44px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; font-size:17px; font-weight:600; }
    #radio-study .page-count { font-size:12px; font-weight:400; color:var(--rh-muted); }
    #radio-study .rows { height:132px; padding:0 8px; }
    #radio-study .row { width:100%; height:44px; display:flex; align-items:center; justify-content:space-between; text-align:left; padding:0 8px!important; font-size:17px; gap:8px; }
    #radio-study .row > span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #radio-study .row small { color:var(--rh-muted); font-size:11px; flex-shrink:0; }
    #radio-study .row[data-focused="true"] { background:var(--rh-soft); box-shadow:inset 2px 0 var(--rh-accent); }
    #radio-study .list-footer { margin:10px 16px; height:44px; border-top:1px solid var(--rh-line); display:flex; justify-content:space-between; align-items:center; gap:4px; }
    #radio-study .list-footer button { min-width:70px; height:44px; font-size:13px; }
    #radio-study .list-footer button:first-child { text-align:left; }
    #radio-study .list-footer button:last-child { text-align:right; }
    #radio-study button:disabled { opacity:.35; cursor:default; }
    #radio-study .volume { position:absolute; left:16px; right:16px; bottom:8px; height:39px; background:var(--rh-bg); padding-top:3px; font-size:13px; }
    #radio-study .volume-label { display:flex; justify-content:space-between; margin-bottom:10px; }
    #radio-study .track { height:3px; background:var(--rh-line); }
    #radio-study .fill { height:3px; background:var(--rh-accent); }
    #radio-study .hardware { width:116px; display:flex; flex-direction:column; align-items:center; gap:16px; }
    #radio-study .knob { width:80px; height:80px; border-radius:50%; border:1px solid var(--rh-line); background:var(--rh-bg); position:relative; font-size:12px; letter-spacing:1px; }
    #radio-study .knob::before { content:""; position:absolute; height:10px; width:2px; background:var(--rh-accent); left:38px; top:9px; }
    #radio-study .turns { display:flex; gap:8px; }
    #radio-study .turns button,#radio-study .hold { border:1px solid var(--rh-line); background:var(--rh-bg); height:44px; min-width:48px; border-radius:3px; font-size:16px; }
    #radio-study .hold { border:0; font-size:12px; height:32px; min-height:44px; }
    #radio-study .context { font-size:12px; color:var(--rh-muted); text-align:center; margin-top:20px; min-height:32px; line-height:18px; }
    #radio-study .quiet { height:180px; padding:31px 16px 0; }
    #radio-study .big-clock { font-size:64px; line-height:68px; font-weight:400; letter-spacing:-3px; font-variant-numeric:tabular-nums; }
    #radio-study .quiet .metadata { margin-top:12px; }
    #radio-study .confirm { height:176px; padding:15px 16px; }
    #radio-study .confirm h2 { font-size:26px; letter-spacing:-.7px; line-height:30px; margin:10px 0; font-weight:500; }
    #radio-study .confirm p { font-size:14px; color:var(--rh-muted); line-height:20px; margin:0; }
    #radio-study .choice { width:50%; }
    #radio-study .choice[data-focused="true"] { color:var(--rh-accent); text-decoration:underline; text-underline-offset:5px; }
    #radio-study .black { background:#101310; color:#eeeadf; height:240px; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:18px; }
    #radio-study .black button { border:1px solid #666e61; min-height:44px; padding:0 16px; font-size:14px; }
    #radio-study .black small { color:#a4ad9a; font-size:12px; }
    @media(max-width:370px) { #radio-study .panel { box-shadow:none; } #radio-study .instrument { gap:22px; } #radio-study .hardware { width:100%; flex-direction:row; justify-content:center; gap:14px; } #radio-study .knob { width:64px; height:64px; } #radio-study .knob::before { left:30px; top:6px; height:8px; } }
  </style>
  <div class="study-title"><span>RADIOHEAD / LISTENING STUDY</span><span>320 × 240 · ILLUSTRATIVE CONTENT</span></div>
  <div class="instrument">
    <div class="panel" id="rh-panel" aria-label="Radio touchscreen"></div>
    <div class="hardware" aria-label="Encoder simulation">
      <button type="button" class="knob" data-hw="push" aria-label="Push encoder">PUSH</button>
      <div class="turns"><button type="button" data-hw="left" aria-label="Turn encoder counterclockwise">−</button><button type="button" data-hw="right" aria-label="Turn encoder clockwise">+</button></div>
      <button type="button" class="hold" data-hw="hold">Hold</button>
    </div>
  </div>
  <div class="context" id="rh-context" aria-live="polite"></div>
  <script>
  (() => {
    const root=document.getElementById('radio-study'), panel=root.querySelector('#rh-panel'), context=root.querySelector('#rh-context');
    const stations=['Dance Wave Retro','Evening Radio','Jazz Room','Public Radio','Night Service','Local Voices'];
    const stationNames=['Dance Wave<br>Retro','Evening<br>Radio','Jazz Room','Public Radio','Night Service','Local Voices'];
    const shows=['Ilana Dayan','Yihye Beseder','Laila Israeli'];
    const episodes=['The evening conversation','A different perspective','From the archive'];
    const state={screen:'home',focus:0,station:0,volume:8,muted:false,source:'radio',show:0,episode:0,stopped:false,alarm:false,hour:7,minute:30,editing:false,volumeVisible:false,history:[]};
    const design={appearance:'System',accent:'Olive',information:'Next alarm'};
    let volumeTimer;
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=n=>String(n).padStart(2,'0');
    const alarmTime=()=>fmt(state.hour)+':'+fmt(state.minute);
    const button=(label,action,extra='')=>`<button type="button" data-action="${action}" ${extra}>${label}</button>`;
    const listData=()=>state.screen==='browse'?['Stations','Podcasts','Settings']:state.screen==='stations'?stations:state.screen==='shows'?shows:state.screen==='episodes'?episodes:state.screen==='settings'?['Alarm','Quiet view','Standby']:['Hour','Minute','Enabled','Save alarm'];
    const title=()=>({browse:'Browse',stations:'Stations',shows:'Podcasts',episodes:shows[state.show],settings:'Settings',alarm:'Alarm'})[state.screen];
    function persist(){if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{direction:'Quiet listening instrument',appearance:design.appearance,screen:state.screen},privateContent:{station:state.station,volume:state.volume,appearance:design.appearance,accent:design.accent}}).catch(()=>{});}
    function restore(saved){const p=saved?.privateContent;if(!p)return;if(Number.isInteger(p.station)&&p.station>=0&&p.station<stations.length)state.station=p.station;if(Number.isInteger(p.volume)&&p.volume>=0&&p.volume<=21)state.volume=p.volume;if(['System','Paper','Charcoal'].includes(p.appearance))design.appearance=p.appearance;if(['Olive','Warm amber'].includes(p.accent))design.accent=p.accent;}
    function applyDesign(){root.style.colorScheme=design.appearance==='Paper'?'light':design.appearance==='Charcoal'?'dark':'light dark';root.style.setProperty('--rh-accent',design.accent==='Olive'?'light-dark(#526442,#bdd09b)':'light-dark(#865a28,#d9b27c)');}
    function navigate(screen){state.history.push({screen:state.screen,focus:state.focus});state.screen=screen;state.focus=0;state.editing=false;state.volumeVisible=false;if(screen==='alarm')state.alarmDraft={hour:state.hour,minute:state.minute,alarm:state.alarm};render();persist();}
    function home(){state.screen='home';state.history=[];state.focus=0;state.editing=false;render();persist();}
    function back(){if(state.editing){state.alarmDraft[state.focus===0?'hour':'minute']=state.fieldBefore;state.editing=false;render();return;}const prev=state.history.pop();state.screen=prev?.screen||'home';state.focus=prev?.focus||0;render();persist();}
    function footer(){const items=listData(),page=Math.floor(state.focus/3);return `<div class="list-footer">${button('Back','back')}${button('Previous','prev',page===0?'disabled':'')}${button('Next','next',(page+1)*3>=items.length?'disabled':'')}</div>`;}
    function render(){
      applyDesign(); let html='',hint='';
      if(state.screen==='home'){
        const name=state.source==='radio'?stationNames[state.station]:escape(shows[state.show]);
        const meta=state.source==='radio'?'Evening transmission · Live':escape(episodes[state.episode]);
        const status=state.alarm?'Alarm '+alarmTime():design.information==='Weather'?'22° · Clear':'Wi-Fi connected';
        html=`<div class="status"><span class="time">20:42</span><span>${status}</span></div><div class="hero"><span class="eyebrow">${state.muted?'MUTED':state.stopped?'STOPPED':state.source==='radio'?'RADIO · '+fmt(state.station+1):'PODCAST'}</span>${button(name,state.source==='radio'?'stations':'episodes','class="station"')}<span class="metadata">${meta}</span>${state.volumeVisible?`<div class="volume"><div class="volume-label"><span>Volume</span><span>${state.volume} / 21</span></div><div class="track"><div class="fill" style="width:${state.volume/21*100}%"></div></div></div>`:''}</div><div class="home-actions">${button('Stations','stations')}${button(state.source==='radio'?(state.muted?'Unmute':'Mute'):(state.stopped?'Play':'Stop'),'transport','class="active"')}${button('Menu','browse')}</div>`;
        hint='Turn: volume · Push: browse · Hold: standby';
      }else if(state.screen==='quiet'){
        html=`<div class="quiet"><span class="eyebrow">${state.alarm?'ALARM '+alarmTime():'EVENING'}</span><div class="big-clock">20:42</div><span class="metadata">${escape(state.source==='radio'?stations[state.station]:shows[state.show])}</span></div><div class="home-actions">${button('Return','home')}<span></span>${button(state.muted?'Unmute':'Mute','mute')}</div>`;
        hint='Quiet view · Audio continues · Push to return';
      }else if(state.screen==='standby'){
        html=`<div class="confirm"><span class="eyebrow">POWER</span><h2>Rest for a while?</h2><p>Stop listening and turn off the display.${state.alarm?'<br>Next alarm '+alarmTime()+'.':''}</p></div><div class="list-footer">${button('Cancel','back',`class="choice" data-focused="${state.focus===0}"`)}${button('Standby','sleep',`class="choice" data-focused="${state.focus===1}"`)}</div>`;hint='Turn: choose · Push: confirm · Hold: cancel';
      }else if(state.screen==='sleep'){
        html=`<div class="black"><span>Standby</span><small>Screen off on the device</small>${button('Simulate K0 wake','home')}</div>`;hint='Deep sleep wakes via K0 or alarm timer in current firmware';
      }else{
        const data=listData(),start=Math.floor(state.focus/3)*3;
        const rows=data.slice(start,start+3).map((name,j)=>{const i=start+j;let detail='';if(state.screen==='stations'&&state.source==='radio'&&i===state.station)detail='Playing';if(state.screen==='alarm'){const d=state.alarmDraft;detail=i===0?fmt(d.hour):i===1?fmt(d.minute):i===2?(d.alarm?'On':'Off'):'';if(state.editing&&i===state.focus)detail='‹ '+detail+' ›';}return button(`<span>${escape(name)}</span><small>${detail}</small>`,'item',`class="row" data-index="${i}" data-focused="${state.focus===i}"`);}).join('');
        html=`<div class="heading"><span>${escape(title())}</span><span class="page-count">${Math.floor(state.focus/3)+1} / ${Math.ceil(data.length/3)}</span></div><div class="rows">${rows}</div>${state.screen==='alarm'?`<div class="list-footer">${button(state.editing?'−':'Cancel',state.editing?'decrease':'back')}${button(state.editing?'+':'',state.editing?'increase':'noop',state.editing?'':'disabled')}${button(state.editing?'Set':'Save',state.editing?'set':'save-alarm')}</div>`:footer()}`;
        hint=state.editing?'Turn: adjust · Push: set field · Hold: cancel field':'Turn: focus · Push: choose · Hold: back';
      }
      panel.innerHTML=html;context.textContent=hint;
    }
    function select(){
      if(state.screen==='home'){navigate('browse');return;}
      if(state.screen==='quiet'){home();return;}
      if(state.screen==='sleep')return;
      if(state.screen==='standby'){if(state.focus===0)back();else{state.screen='sleep';render();}return;}
      if(state.screen==='browse'){navigate(['stations','shows','settings'][state.focus]);return;}
      if(state.screen==='stations'){state.station=state.focus;state.source='radio';state.stopped=false;home();return;}
      if(state.screen==='shows'){state.show=state.focus;navigate('episodes');return;}
      if(state.screen==='episodes'){state.episode=state.focus;state.source='podcast';state.stopped=false;home();return;}
      if(state.screen==='settings'){navigate(['alarm','quiet','standby'][state.focus]);return;}
      if(state.screen==='alarm'){if(state.focus===3){Object.assign(state,state.alarmDraft);back();return;}if(state.focus===2)state.alarmDraft.alarm=!state.alarmDraft.alarm;else if(state.editing)state.editing=false;else{state.editing=true;state.fieldBefore=state.alarmDraft[state.focus===0?'hour':'minute'];}render();}
    }
    function turn(delta){
      if(state.screen==='sleep')return;
      if(state.screen==='home'||state.screen==='quiet'){if(state.screen==='quiet')home();state.volume=Math.max(0,Math.min(21,state.volume+delta));state.muted=false;state.volumeVisible=true;clearTimeout(volumeTimer);volumeTimer=setTimeout(()=>{state.volumeVisible=false;render();},1500);}
      else if(state.editing){const key=state.focus===0?'hour':'minute',max=key==='hour'?23:59;state.alarmDraft[key]=Math.max(0,Math.min(max,state.alarmDraft[key]+delta));}
      else state.focus=Math.max(0,Math.min((state.screen==='standby'?2:listData().length)-1,state.focus+delta));
      render();persist();
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||!root.contains(b))return;
      if(b.dataset.hw){if(b.dataset.hw==='left')turn(-1);if(b.dataset.hw==='right')turn(1);if(b.dataset.hw==='push')select();if(b.dataset.hw==='hold'){if(state.screen==='sleep')return;if(state.screen==='home'||state.screen==='quiet')navigate('standby');else back();}persist();return;}
      const a=b.dataset.action;
      if(a==='item'){const i=Number(b.dataset.index);if(state.editing&&i!==state.focus)return;state.focus=i;select();}
      else if(a==='home')home();else if(a==='back')back();
      else if(a==='prev'||a==='next'){const page=Math.floor(state.focus/3)+(a==='prev'?-1:1);state.focus=Math.min(listData().length-1,Math.max(0,page*3));render();}
      else if(a==='mute'||a==='transport'){if(a==='transport'&&state.source==='podcast')state.stopped=!state.stopped;else state.muted=!state.muted;render();}
      else if(a==='sleep'){state.screen='sleep';render();}
      else if(a==='save-alarm'){Object.assign(state,state.alarmDraft);back();}
      else if(a==='set'){state.editing=false;render();}
      else if(a==='decrease'||a==='increase')turn(a==='increase'?1:-1);
      else if(a!=='noop')navigate(a);
      persist();
    });
    restore(window.openai?.widgetState);render();
    window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(design,'appearance',{label:'Appearance',options:['System','Paper','Charcoal']});tweak.addSelect(design,'accent',{label:'Accent',options:['Olive','Warm amber']});tweak.addSelect(design,'information',{label:'Quiet status',options:['Next alarm','Weather']});}
  })();
  </script>
</div>
