[env:esp32s3]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

; The connected ESP32-S3 is the N16R8V variant: 16 MB quad-flash plus
; 8 MB octal PSRAM.  This board definition selects the matching ESP-IDF
; libraries, allowing the Home renderer to retain its readable RGB565 canvas.
board = esp32-s3-devkitc1-n16r8

monitor_speed = 115200
upload_protocol = esptool

; ESP32-S3 N16R8:
; 16 MB QSPI flash
; 8 MB Octal/OPI PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
extra_scripts = pre:tools/prepare_ui_assets.py

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_BUILD=\"esp32s3\"
    ; -DTOUCH_DEBUG_ENABLED=1

lib_deps =
    lovyan03/LovyanGFX@1.2.21
    bblanchon/ArduinoJson@7.4.3

; Temporary S0 baseline build. Normal esp32s3 builds omit all diagnostic code.
[env:esp32s3-validation]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DRADIO_VALIDATION_DIAGNOSTICS=1

[env:esp32s3-handoff-probe]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DRADIO_S2_HANDOFF_PROBE=1
