[platformio]
default_envs = esp32s3

[env:esp32s3]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; ESP-IDF/CMake owns the only application build. No PlatformIO framework builder
; is selected: this environment only installs packages and delegates to IDF.
platform_packages =
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.5/esp-idf-v5.5.5.tar.xz
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
    tool-cmake @ https://github.com/pioarduino/registry/releases/download/0.0.1/cmake-4.0.3.zip
    tool-ninja @ https://github.com/pioarduino/registry/releases/download/0.0.1/ninja-1.13.1.zip

; Board metadata for port detection and monitor/upload convenience.
; Native hardware configuration lives in sdkconfig.defaults and partitions.csv.
board = esp32-s3-devkitc1-n16r8

monitor_speed = 115200
upload_protocol = esptool

extra_scripts =
    pre:tools/platformio_idf.py

lib_deps =
    lovyan03/LovyanGFX@1.2.21
    bblanchon/ArduinoJson@7.4.3


; Flash the existing build without rebuilding:
; ~/.platformio/penv/bin/python tools/flash_built_firmware.py --port /dev/cu.usbmodem11201
